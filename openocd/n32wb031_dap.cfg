# ============================================================================
#  OpenOCD configuration for N32WB031 (Cortex-M0)
#  Flash: 512KB @ 0x01000000  |  SRAM: 48KB @ 0x20000000
#  CMSIS-DAP (DAPLink), SWD
#
#  See n32wb031.cfg for the ST-Link V2 variant — both target the same chip
#  and share flash_n32.tcl (probe-agnostic).
# ============================================================================

# -- Interface ------------------------------------------------
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 4000

# -- Target: Cortex-M0 ----------------------------------------
set CHIPNAME  n32wb031
set CPUTAPID  0x0BB11477

source [find target/swj-dp.tcl]
swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
           -expected-id $CPUTAPID

dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# -- Work area ------------------------------------------------
# Placed away from data buffer (0x20000000) and stub (0x2000B000)
$CHIPNAME.cpu configure \
    -work-area-phys 0x20008000 \
    -work-area-size 0x1000 \
    -work-area-backup 0

# -- Flash ----------------------------------------------------
# N32WB031 uses a proprietary Qflash controller -- no standard OpenOCD
# flash driver works. Flash is programmed via RAM-resident stub:
#   tools/flash_write_ram.elf  (built by flash.bat, or `make` on macOS)
#   openocd/flash_n32.tcl      (Tcl orchestration)

# -- Reset ----------------------------------------------------
cortex_m reset_config sysresetreq
reset_config none
