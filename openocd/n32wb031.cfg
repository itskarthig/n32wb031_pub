# ============================================================================
#  OpenOCD configuration for N32WB031 (Cortex-M0)
#  Flash: 512KB @ 0x01000000  |  SRAM: 48KB @ 0x20000000
#  ST-Link V2, SWD
# ============================================================================

# -- Interface ------------------------------------------------
source [find interface/stlink.cfg]
# Homebrew's OpenOCD 0.12.0 ships the legacy "hla" ST-Link driver, which
# registers its own namespaced transport names -- hla_swd/hla_jtag -- not the
# generic swd/jtag used by DAP-capable drivers. Using plain "swd" there fails
# with "Debug adapter doesn't support 'swd' transport" before any USB traffic
# even happens. xPack's OpenOCD build (recommended -- see CLAUDE.md) uses a
# newer ST-Link driver that's the reverse: it only accepts the generic "swd"
# and errors on "hla_swd". Try "swd" first (matches the proven Windows
# flash.bat setup) and fall back to "hla_swd" for older/Homebrew builds.
if {[catch {transport select swd}]} {
    transport select hla_swd
}
adapter speed 4000

# -- Target: Cortex-M0 ----------------------------------------
set CHIPNAME  n32wb031
set CPUTAPID  0x0BB11477

source [find target/swj-dp.tcl]
swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
           -expected-id $CPUTAPID

dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# -- Work area ------------------------------------------------
# Placed away from data buffer (0x20000000) and stub (0x2000B000)
$CHIPNAME.cpu configure \
    -work-area-phys 0x20008000 \
    -work-area-size 0x1000 \
    -work-area-backup 0

# -- Flash ----------------------------------------------------
# N32WB031 uses a proprietary Qflash controller -- no standard OpenOCD
# flash driver works. Flash is programmed via RAM-resident stub:
#   tools/flash_write_ram.elf  (built by flash.bat)
#   openocd/flash_n32.tcl      (Tcl orchestration)

# -- Reset ----------------------------------------------------
# `cortex_m reset_config sysresetreq` is deliberately NOT set here: the "hla"
# driver's own low-level reset/halt handling replaces direct ARM debug
# register access, so that command isn't registered under hla and errors with
# "invalid command name cortex_m". flash_n32.tcl's n32_reset guards its own
# call to this command with catch{} for the same reason -- it only takes
# effect under DAP-capable drivers (see n32wb031_dap.cfg).
reset_config none
# reset_config srst_only srst_nogate connect_assert_srst
